<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shula — Vista mobile + desktop</title>
  <link rel="stylesheet" href="css/shula.css">
  <style>
    body { background: #D9CFBF; }
    .bar { display: flex; gap: 28px; align-items: center; padding: 18px 32px; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; }
    .bar a.on { border-bottom: 1px solid; }
    .bar .logo { margin-right: auto; }
    .stage { display: flex; gap: 40px; align-items: flex-start; padding: 8px 32px 40px; }
    .dev p { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .phone { width: 390px; height: 844px; border: 1px solid var(--choco); background: var(--marfil); flex: none; }
    .phone iframe { width: 390px; height: 842px; border: 0; display: block; }
    .desk { flex: 1; min-width: 0; }
    .desk .frame { width: 100%; aspect-ratio: 1440 / 900; border: 1px solid var(--choco); overflow: hidden; position: relative; background: var(--marfil); }
    .desk iframe { width: 1440px; height: 900px; border: 0; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="logo">shula</span>
    <a href="#" data-src="index.html" class="on">Home</a>
    <a href="#" data-src="pieza.html?id=top-caida">Pieza</a>
    <a href="direccion.html">Dirección visual</a>
  </div>
  <div class="stage">
    <div class="dev"><p>Mobile · 390</p><div class="phone"><iframe id="m" src="index.html" title="Mobile"></iframe></div></div>
    <div class="dev desk"><p>Desktop · 1440 (escalado)</p><div class="frame"><iframe id="d" src="index.html" title="Desktop"></iframe></div></div>
  </div>
  <script>
    var d = document.getElementById("d"), frame = document.querySelector(".frame");
    function fit() { d.style.transform = "scale(" + frame.clientWidth / 1440 + ")"; }
    addEventListener("resize", fit); fit();
    document.querySelectorAll("[data-src]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        document.querySelectorAll("[data-src]").forEach(function (x) { x.classList.toggle("on", x === a); });
        document.getElementById("m").src = a.dataset.src; d.src = a.dataset.src;
      });
    });
  </script>
</body>
</html>
